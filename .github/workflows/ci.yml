name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BUILD_BUDGET_MS: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # playwright.config's webServer rebuilds dist with VITE_E2E=1 (the e2e build, with the test
      # hooks) and serves it; with CI set it never reuses a server. The deployed build has no hooks.
      - name: Playwright (e2e build; smoke, ui and robust specs)
        run: npx playwright test e2e/smoke.spec.ts e2e/ui.spec.ts e2e/robust.spec.ts
